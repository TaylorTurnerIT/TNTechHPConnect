[package]
name = "tntech-hpc"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust CLI mirroring Google Colab CLI workflows for the TN Tech University HPC clusters (Impulse / Warp 1)"
license = "MIT"
authors = ["TNTechHPConnect"]

[[bin]]
name = "tntech-hpc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
